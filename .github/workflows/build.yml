name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make libssl-dev bison flex bc libelf-dev git wget tar xz-utils gcc-aarch64-linux-gnu device-tree-compiler libncurses-dev zstd lz4 python3 python-is-python3 cpio rsync

      - name: Download AOSP clang-r510928 (Clang 18)
        run: |
          curl -L -o clang-r510928.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android15-platform-release/clang-r510928.tar.gz"
          mkdir -p clang-toolchain
          tar -xf clang-r510928.tar.gz -C clang-toolchain
          rm clang-r510928.tar.gz
          ./clang-toolchain/bin/clang --version

      - name: Prepare env & load gki_defconfig
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CC="clang"
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          export PATH="$PWD/clang-toolchain/bin:$PATH"

          echo "ARCH=$ARCH" >> $GITHUB_ENV
          echo "SUBARCH=$SUBARCH" >> $GITHUB_ENV
          echo "CC=$CC" >> $GITHUB_ENV
          echo "CROSS_COMPILE=$CROSS_COMPILE" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32" >> $GITHUB_ENV
          echo "PATH=$PATH" >> $GITHUB_ENV

          mkdir -p out
          make O=out gki_defconfig

      - name: Kernel compile
        run: |
          make CC="clang" LLVM=1 LLVM_IAS=1 O=out CFLAGS_KERNEL="-Wno-unused-function" -j$(nproc)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-out
          if-no-files-found: warn
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
            out/arch/arm64/boot/dtb
